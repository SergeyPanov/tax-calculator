worker_processes auto;
events {
  worker_connections 1024;
}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  client_max_body_size 25m;
  client_body_timeout 60s;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 120s;
  log_format main '$remote_addr - $request_time "$request" '
                  '$status $body_bytes_sent upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;
  gzip on;
  gzip_types application/json text/plain;

  map $host $backend_pool {
    default tax-calculator:8000;
  }

  server {
    listen 80;
    server_name _;
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/local/live/cz-tax-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/local/live/cz-tax-api.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      proxy_pass http://$backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_request_buffering off;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
